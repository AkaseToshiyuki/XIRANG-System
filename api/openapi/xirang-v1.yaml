        maxUses: { type: integer, minimum: 1, maximum: 1024 }
        requireApproval: { type: boolean }
    CreatedEnrollmentToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/EnrollmentToken" }
        secret: { type: string, writeOnly: true }
    EnrollmentToken:
      type: object
      required: [id, name, requireApproval, maxUses, uses, createdAt, expiresAt]
      properties:
        id: { type: string }
        name: { type: string }
        requireApproval: { type: boolean }
        maxUses: { type: integer }
        uses: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    RegisterNode:
