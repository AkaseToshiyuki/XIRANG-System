        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SharedFile:
      type: object
      required: [path, name, directory, sizeBytes, modifiedAt, owner, ownedByUser]
      properties:
        path: { type: string }
        name: { type: string }
        directory: { type: boolean }
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
        owner: { type: string }
        ownedByUser: { type: boolean }
    SharedFilePath:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 1024 }
    RenameSharedFile:
      type: object
      additionalProperties: false
      required: [oldPath, newPath]
      properties:
        oldPath: { type: string, minLength: 1, maxLength: 1024 }
        newPath: { type: string, minLength: 1, maxLength: 1024 }
    TerminalTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    Taint:
      type: object
      additionalProperties: false
      required: [key, effect]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
