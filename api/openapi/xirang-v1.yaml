        nodeId: { type: string }
        status: { type: string, enum: [exported, mounted, available, failed] }
        message: { type: string }
    SharedSpace:
      type: object
      required: [id, name, sourceNodeId, sourcePath, mountPath, target, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        sourceNodeId: { type: string }
        sourcePath: { type: string }
        mountPath: { type: string }
        target: { type: string, enum: [all, group, nodes] }
        targetGroup: { type: string }
        targetNodeIds:
          type: array
          items: { type: string }
        status: { type: string, enum: [applying, active, degraded, failed] }
        results:
          type: array
          items: { $ref: "#/components/schemas/SharedSpaceNodeResult" }
        usedBytes: { type: integer, format: int64, minimum: 0 }
        availableBytes: { type: integer, format: int64, minimum: 0 }
        totalBytes: { type: integer, format: int64, minimum: 0 }
        capacityObservedAt: { type: string, format: date-time }
