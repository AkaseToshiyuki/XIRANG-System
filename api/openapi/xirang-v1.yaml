        effect: { type: string, enum: [NoSchedule, NoExecute] }
    NUMANode:
      type: object
      required: [id, cpus, memoryBytes]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        cpus: { type: string }
        memoryBytes: { type: integer, format: int64, minimum: 0 }
    Toleration:
      type: object
      additionalProperties: false
      required: [key, effect]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        value: { type: string, maxLength: 256 }
        effect: { type: string, enum: [NoSchedule, NoExecute] }
    ResourceVector:
      type: object
      required: [milliCpu, memoryBytes, ephemeralStorageBytes]
      properties:
        milliCpu: { type: integer, format: int64, minimum: 0 }
        memoryBytes: { type: integer, format: int64, minimum: 0 }
        ephemeralStorageBytes: { type: integer, format: int64, minimum: 0, description: Node-capacity field; job submissions must set this to zero because storage is governed by administrator quotas. }
        devices:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    NetworkInterfaceSnapshot:
      type: object
      required: [name]
      properties:
        name: { type: string }
        macAddress: { type: string }
        addresses:
          type: array
          items: { type: string }
        speedBitsPerSecond: { type: integer, format: int64, minimum: 0 }
        mtu: { type: integer, format: int32, minimum: 0 }
    DeviceSnapshot:
      type: object
      required: [resourceName]
      properties:
        resourceName: { type: string }
        vendor: { type: string }
        model: { type: string }
        deviceId: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
    NodeInventorySnapshot:
      type: object
      required: [nodeId, hostname, architecture, logicalCpuCount, memoryBytes, observedAt, receivedAt]
      properties:
        nodeId: { type: string }
        hostname: { type: string }
        distribution: { type: string }
        kernelVersion: { type: string }
        architecture: { type: string }
        runtimeFacts: { type: object, additionalProperties: { type: string } }
        logicalCpuCount: { type: integer, format: int32, minimum: 1 }
        cpuModel: { type: string }
        cpuFeatures:
          type: array
          items: { type: string }
        cpuBenchmarkScore: { type: number, format: double, minimum: 0 }
        computeWeight: { type: number, format: double, minimum: 0 }
        memoryBytes: { type: integer, format: int64, minimum: 1 }
        networkInterfaces:
          type: array
          items: { $ref: "#/components/schemas/NetworkInterfaceSnapshot" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/DeviceSnapshot" }
        numaTopology:
          type: array
          items: { $ref: "#/components/schemas/NUMANode" }
        labels:
          type: object
          additionalProperties: { type: string }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    TelemetryIntervalSettings:
      type: object
      required: [intervalSeconds, minimumSeconds, maximumSeconds]
      properties:
        intervalSeconds: { type: integer, minimum: 2, maximum: 60 }
        minimumSeconds: { type: integer, const: 2 }
        maximumSeconds: { type: integer, const: 60 }
    NodeResourceObservation:
      type: object
      required: [messageId, nodeId, usedMilliCpu, usedMemoryBytes, receivedBytes, transmittedBytes, cpuTemperatureAvailable, gpuUtilizationAvailable, gpuTemperatureAvailable, observedAt, receivedAt]
      properties:
        messageId: { type: string }
        nodeId: { type: string }
        usedMilliCpu: { type: integer, format: int64, minimum: 0 }
        usedMemoryBytes: { type: integer, format: int64, minimum: 0 }
        receivedBytes: { type: integer, format: int64, minimum: 0 }
        transmittedBytes: { type: integer, format: int64, minimum: 0 }
        usedDevices:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        cpuTemperatureC: { type: number, format: double, minimum: 0, maximum: 250 }
        cpuTemperatureAvailable: { type: boolean }
        cpuTemperatureSource: { type: string, maxLength: 128, description: Read-only provider such as hwmon/thermal-zone, ipmi, or redfish. }
        cpuTemperatureConfidence: { type: string, enum: [high, medium, low] }
        gpuTemperatureC: { type: number, format: double, minimum: 0, maximum: 250 }
        gpuUtilizationPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        gpuUtilizationAvailable: { type: boolean }
        gpuTemperatureAvailable: { type: boolean }
        accelerators:
          type: array
          items: { $ref: "#/components/schemas/AcceleratorObservation" }
        interfaceCounters:
          type: object
          additionalProperties: { $ref: "#/components/schemas/NetworkInterfaceCounters" }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    AcceleratorObservation:
      type: object
      required: [id, vendor, utilizationAvailable, temperatureAvailable]
      properties:
        id: { type: string }
        vendor: { type: string }
        utilizationPercent: { type: number, format: double, minimum: 0, maximum: 100 }
        temperatureC: { type: number, format: double, minimum: 0, maximum: 250 }
        memoryUsedBytes: { type: integer, format: int64, minimum: 0 }
        memoryTotalBytes: { type: integer, format: int64, minimum: 0 }
        utilizationAvailable: { type: boolean }
        temperatureAvailable: { type: boolean }
    NetworkInterfaceCounters:
      type: object
      required: [receivedBytes, transmittedBytes, receivedPackets, transmittedPackets, receiveErrors, transmitErrors, receiveDropped, transmitDropped, packetCountersSupported]
      properties:
        receivedBytes: { type: integer, format: int64, minimum: 0 }
        transmittedBytes: { type: integer, format: int64, minimum: 0 }
        receivedPackets: { type: integer, format: int64, minimum: 0 }
        transmittedPackets: { type: integer, format: int64, minimum: 0 }
        receiveErrors: { type: integer, format: int64, minimum: 0 }
        transmitErrors: { type: integer, format: int64, minimum: 0 }
        receiveDropped: { type: integer, format: int64, minimum: 0 }
        transmitDropped: { type: integer, format: int64, minimum: 0 }
        packetCountersSupported: { type: boolean, description: True when packet, error, and dropped counters were explicitly collected by the Agent. }
    TopologyVertex:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [host, switch, router, unknown] }
        labels:
          type: object
          additionalProperties: { type: string }
    TopologyEdge:
      type: object
      required: [id, type, sourceId, targetId, observedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [neighbor, route, lldp, probe] }
        sourceId: { type: string }
        targetId: { type: string }
        sourceInterface: { type: string }
        targetInterface: { type: string }
        sourceAddress: { type: string }
        targetAddress: { type: string }
        capacityBits: { type: integer, format: int64, minimum: 0, description: Source-interface line rate reported by native inventory. }
        observedBits: { type: integer, format: int64, minimum: 0, description: Current source-interface aggregate bits per second; latest snapshot only. }
        observedPacketsPerSecond: { type: number, format: double, minimum: 0, description: Current source-interface aggregate packets per second; latest snapshot only. }
        droppedPacketsPerSecond: { type: number, format: double, minimum: 0, description: Current source-interface RX and TX dropped packets per second; latest snapshot only. }
        errorPacketsPerSecond: { type: number, format: double, minimum: 0, description: Current source-interface RX and TX error packets per second; latest snapshot only. }
        dropRatio: { type: number, format: double, minimum: 0, maximum: 1, description: Dropped packets divided by observed plus dropped packets for the sample interval. }
        health: { type: string, enum: [healthy, degraded, critical], description: Informational interface health derived from counter deltas; not a persisted alert. }
        latencyMicros: { type: integer, format: int64, minimum: 0 }
        observedAt: { type: string, format: date-time }
    NetworkPathSelection:
      type: object
      required: [sourceId, targetId, primaryEdgeId, bidirectional, policy]
      properties:
        sourceId: { type: string }
        targetId: { type: string }
        primaryEdgeId: { type: string }
        primaryReverseEdgeId: { type: string }
        fallbackEdgeIds:
          type: array
          items: { type: string }
        fallbackReverseEdgeIds:
          type: array
          items: { type: string }
        effectiveCapacityBits: { type: integer, format: int64, minimum: 0, description: Minimum capacity of the exact reciprocal directed observations; parallel links are not summed. }
        effectiveLatencyMicros: { type: integer, format: int64, minimum: 0, description: Maximum latency of the reciprocal directed observations. }
        health: { type: string, enum: [healthy, degraded, critical] }
        bidirectional: { type: boolean, description: True only when exact reciprocal source and target address observations were matched. }
        policy: { type: string, enum: [single-best-healthy] }
    TopologyRoute:
      type: object
      required: [nodeId, destination, interfaceName, table, family]
      properties:
        nodeId: { type: string }
        destination: { type: string }
        gateway: { type: string }
        interfaceName: { type: string }
        metric: { type: integer, format: int32, minimum: 0 }
        table: { type: integer, format: int32, minimum: 0 }
        family: { type: string, enum: [ipv4, ipv6] }
    TopologyNeighbor:
      type: object
      required: [nodeId, address, interfaceName, state]
      properties:
        nodeId: { type: string }
        address: { type: string }
        macAddress: { type: string }
        interfaceName: { type: string }
        state: { type: string }
        router: { type: boolean }
    TopologyLLDPNeighbor:
      type: object
      required: [nodeId, localInterface, chassisId]
      properties:
        nodeId: { type: string }
        localInterface: { type: string }
        chassisId: { type: string }
        portId: { type: string }
        systemName: { type: string }
        systemDescription: { type: string }
        managementAddresses:
          type: array
          items: { type: string }
    NetworkPathProbe:
      type: object
      required: [nodeId, targetNodeId, sourceInterface, sourceAddress, targetInterface, targetAddress, reachable, observedAt]
      properties:
        nodeId: { type: string }
        targetNodeId: { type: string }
        sourceInterface: { type: string }
        sourceAddress: { type: string }
        targetInterface: { type: string }
        targetAddress: { type: string }
        sourceSpeedBitsPerSecond: { type: integer, format: int64, minimum: 0 }
        targetSpeedBitsPerSecond: { type: integer, format: int64, minimum: 0 }
        latencyMicros: { type: integer, format: int64, minimum: 0 }
        reachable: { type: boolean }
        failure: { type: string }
        observedAt: { type: string, format: date-time }
    TopologySnapshot:
      type: object
      required: [version, generatedAt, reportCount, vertices, edges]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        generatedAt: { type: string, format: date-time }
        reportCount: { type: integer, minimum: 1 }
        vertices:
          type: array
          items: { $ref: "#/components/schemas/TopologyVertex" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TopologyEdge" }
        pathSelections:
          type: array
          description: Latest response-local primary and fallback choices for parallel observed links.
          items: { $ref: "#/components/schemas/NetworkPathSelection" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/TopologyRoute" }
        neighbors:
          type: array
          items: { $ref: "#/components/schemas/TopologyNeighbor" }
        lldpNeighbors:
          type: array
          items: { $ref: "#/components/schemas/TopologyLLDPNeighbor" }
        pathProbes:
          type: array
          description: Latest full source-address-to-target-address reachability measurements reported by Agents.
          items: { $ref: "#/components/schemas/NetworkPathProbe" }
    NetworkFlow:
      type: object
      required: [family, protocol, sourceAddress, sourcePort, destinationAddress, destinationPort, direction, packets, bytes]
      properties:
        family: { type: string, enum: [ipv4, ipv6] }
        protocol: { type: string, enum: [tcp, udp] }
        sourceAddress: { type: string }
        sourcePort: { type: integer, minimum: 0, maximum: 65535 }
        destinationAddress: { type: string }
        destinationPort: { type: integer, minimum: 0, maximum: 65535 }
        direction: { type: string, enum: [ingress, egress] }
        packets: { type: integer, format: int64, minimum: 1 }
        bytes: { type: integer, format: int64, minimum: 1 }
    NodeFlowObservation:
      type: object
      required: [messageId, nodeId, flows, truncated, mapEntries, interval, observedAt, receivedAt]
      properties:
        messageId: { type: string }
        nodeId: { type: string }
        flows:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/NetworkFlow" }
        truncated: { type: boolean }
        mapEntries: { type: integer, minimum: 0, maximum: 1048576 }
        interval: { type: integer, format: int64, minimum: 1000000000, description: Observation interval in nanoseconds. }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    Alert:
      type: object
      required: [id, fingerprint, kind, sourceNodeId, sourceInterface, status, severity, observedHealth, summary, observedBits, droppedPacketsPerSecond, errorPacketsPerSecond, dropRatio, firstObservedAt, lastObservedAt, revision]
      properties:
        id: { type: string }
        fingerprint: { type: string, description: Stable condition identity for one alert series. }
        kind: { type: string, enum: [interface_health, job_storage, group_storage, node_storage] }
        sourceNodeId: { type: string }
        sourceInterface: { type: string }
        status: { type: string, enum: [firing, acknowledged, resolved] }
        severity: { type: string, enum: [info, warning, critical] }
        observedHealth: { type: string, enum: [healthy, degraded, critical, unhealthy] }
        summary: { type: string }
        observedBits: { type: integer, format: int64, minimum: 0 }
        droppedPacketsPerSecond: { type: number, format: double, minimum: 0 }
        errorPacketsPerSecond: { type: number, format: double, minimum: 0 }
        dropRatio: { type: number, format: double, minimum: 0, maximum: 1 }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        firingAt: { type: string, format: date-time }
        healthySince: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        acknowledgedBy: { type: string }
        resolvedAt: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
    AlertWebhookStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        destination: { type: string, description: Host and optional port only; URL path and signing secret are never exposed. }
    AlertDelivery:
      type: object
      required: [id, eventType, alertId, alertRevision, alert, state, attempts, createdAt]
      properties:
        id: { type: string, description: Stable event identifier used by receivers for deduplication. }
        eventType: { type: string, enum: [alert.firing, alert.updated, alert.acknowledged, alert.resolved] }
        alertId: { type: string }
        alertRevision: { type: integer, format: int64, minimum: 1 }
        alert: { $ref: "#/components/schemas/Alert" }
        state: { type: string, enum: [pending, retrying, delivered, failed] }
        attempts: { type: integer, minimum: 0 }
        responseStatus: { type: integer, minimum: 100, maximum: 599 }
        lastError: { type: string, maxLength: 512 }
        createdAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actorType, actorId, action, targetKind, targetId, outcome, occurredAt]
      properties:
        id: { type: string }
        actorType: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetKind: { type: string }
        targetId: { type: string }
        outcome: { type: string }
        occurredAt: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: { type: string }
