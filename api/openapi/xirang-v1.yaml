        caCertificatePem: { type: string }
    CertificateRotationResult:
      type: object
      required: [node, certificatePem, caCertificatePem]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        certificatePem: { type: string, writeOnly: true }
        caCertificatePem: { type: string }
    InventorySummary:
      type: object
      additionalProperties: false
      required: [hostname, os, architecture, cpuCount, memoryBytes]
      properties:
        hostname: { type: string }
        os: { type: string, const: linux }
        architecture: { type: string }
        distribution: { type: string }
        kernelVersion: { type: string }
        runtimeFacts: { type: object, additionalProperties: { type: string } }
        agentVersion: { type: string }
        capabilities:
          type: array
          items: { type: string }
        cpuCount: { type: integer, minimum: 1 }
        cpuModel: { type: string, maxLength: 512 }
        cpuFeatures:
          type: array
          maxItems: 1024
          items: { type: string, maxLength: 64 }
        cpuBenchmarkScore: { type: number, format: double, minimum: 0 }
        computeWeight: { type: number, format: double, minimum: 0 }
        memoryBytes: { type: integer, format: int64, minimum: 1 }
        devices:
          type: object
          maxProperties: 64
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        numaTopology:
          type: array
          items: { $ref: "#/components/schemas/NUMANode" }
        deviceTopology:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer, format: int64, minimum: 0 }
    Node:
      type: object
      required: [id, name, status, os, architecture, capacity, allocatable, allocated, revision, createdAt, updatedAt, lastSeenAt]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        desiredStatus: { type: string, enum: [ready, cordoned, draining] }
        pendingModeCommandId: { type: string }
        pendingManagementCommandId: { type: string }
        desiredManagementPanel: { type: boolean }
        managementPanelEnabled: { type: boolean }
        managementPanelStatus: { type: string }
        os: { type: string }
        architecture: { type: string }
        distribution: { type: string }
        kernelVersion: { type: string }
        runtimeFacts: { type: object, additionalProperties: { type: string } }
        agentVersion: { type: string }
        cpuModel: { type: string }
        cpuFeatures:
          type: array
          items: { type: string }
        cpuBenchmarkScore: { type: number, format: double, minimum: 0 }
        computeWeight: { type: number, format: double, minimum: 0 }
        computePriority: { type: integer, minimum: -1000, maximum: 1000 }
        certificateSerial: { type: string }
        certificateNotAfter: { type: string, format: date-time }
        pendingCertificateSerial: { type: string }
        pendingCertificateNotAfter: { type: string, format: date-time }
        pendingCertificateCommandId: { type: string }
        pendingCertificateRotationId: { type: string }
        certificateRevokedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time }
        labels:
          type: object
          additionalProperties: { type: string }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [management, compute, storage] }
        managementAddress: { type: string }
        sshUser: { type: string }
        group: { type: string }
        taints:
          type: array
          items: { $ref: "#/components/schemas/Taint" }
        numaTopology:
          type: array
          items: { $ref: "#/components/schemas/NUMANode" }
        deviceTopology:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer, format: int64, minimum: 0 }
        capacity: { $ref: "#/components/schemas/ResourceVector" }
        allocatable: { $ref: "#/components/schemas/ResourceVector" }
        allocated: { $ref: "#/components/schemas/ResourceVector" }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
    CreateSharedSpace:
      type: object
      additionalProperties: false
      required: [name, sourceNodeId, sourcePath, mountPath, target]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        sourceNodeId: { type: string }
        sourcePath:
          type: string
          description: Absolute export path on a node with the storage role.
        mountPath:
          type: string
          description: Absolute task-visible mount path on selected nodes.
        target: { type: string, enum: [all, group, nodes] }
        targetGroup: { type: string }
        targetNodeIds:
          type: array
          uniqueItems: true
          items: { type: string }
    SharedSpaceNodeResult:
      type: object
      required: [nodeId, status]
