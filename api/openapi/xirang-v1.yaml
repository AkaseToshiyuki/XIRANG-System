        agentVersion: { type: string }
        hostname: { type: string }
        architecture: { type: string }
        distribution: { type: string }
        kernelVersion: { type: string }
        cpuCount: { type: integer, minimum: 1 }
        memoryBytes: { type: integer, format: int64, minimum: 1 }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/NetworkInterfaceSnapshot" }
        fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        enrolledNodeId: { type: string }
        status: { type: string, enum: [discovered, approved, rejected] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        lastScanId: { type: string }
        approvedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
    DiscoveryBootstrap:
      type: object
