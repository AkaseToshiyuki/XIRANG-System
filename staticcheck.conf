# Static analysis configuration for `make lint`.
#
# The list is staticcheck's own default set: "all" minus the stylistic ST checks
# it disables out of the box. Nothing is excluded on top of that.
#
# `make lint` does not hand the generated protocol bindings under gen/ to
# staticcheck. Their findings belong to protoc-gen-go and come back on every
# regeneration, so they are skipped by scope rather than by switching a check
# off for the code that is actually maintained here.
checks = [
  "all",
  # staticcheck's own default exclusions.
  "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023",
]
