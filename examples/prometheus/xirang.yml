# Replace the example hostname and provision a managed viewer OIDC credential or
# a bounded session exchanged from a one-use viewer API token (see Operations).
# Refresh it before expiry; keep the file readable only by the monitoring identity.
global:
  scrape_interval: 60s
  scrape_timeout: 10s
scrape_configs:
  - job_name: xirang
    scheme: https
    metrics_path: /api/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/xirang-viewer.token
    tls_config:
      ca_file: /etc/prometheus/xirang-ca.pem
    static_configs:
      - targets: ['controller.example.org:8899']
